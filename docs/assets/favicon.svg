<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Voltron Engine">
  <title>Voltron Engine</title>
  <!--
    Simplified V/A mark for 16-32px. An upright chevron + crossbar (front, currentColor)
    overlaid on a vertically-inverted copy of the same chevron (behind, amber, dimmed) so
    it reads as an A behind a V. Front stays single-color-safe via currentColor.
  -->
  <defs>
    <linearGradient id="favDuotone" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="27" y2="28">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- BACK LAYER: inverted (flipped about y=16) copy — the A behind. Amber + dimmed so it recedes. -->
  <g transform="translate(0,32) scale(1,-1)" opacity="0.45"
     fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 26 L16 6 L26 26"/>
    <path d="M10 19 L22 19"/>
  </g>

  <!-- FRONT LAYER: upright chevron — the V in front. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 26 L16 6 L26 26"/>
    <path d="M10 19 L22 19"/>
  </g>
  <circle cx="16" cy="6" r="3" fill="currentColor"/>
</svg>
