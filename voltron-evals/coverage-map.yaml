        prompt_inputs:
          command_hint: "Analyze build output and report bundle sizes per chunk."
          verdict_terms: { pass: "WITHIN_BUDGET", fail: "OVER_BUDGET" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/bundle-sizer"
          fixtures:
            - { id: "small", dir: "voltron-evals/lib/fixtures/instances/bundle-sizer/small", expected_verdict: "pass" }
            - { id: "large", dir: "voltron-evals/lib/fixtures/instances/bundle-sizer/large", expected_verdict: "fail" }

