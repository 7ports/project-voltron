        prompt_inputs:
          command_hint: "Find unused exports, unimported files, and unreachable code."
          verdict_terms: { pass: "NO_DEAD_CODE", fail: "DEAD_CODE" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/dead-code-finder"
          fixtures:
            - { id: "clean", dir: "voltron-evals/lib/fixtures/instances/dead-code-finder/clean", expected_verdict: "pass" }
            - { id: "dead",  dir: "voltron-evals/lib/fixtures/instances/dead-code-finder/dead",  expected_verdict: "fail" }

      stringer-baseline-builder:
        prompt_inputs:
          command_hint: "stringer scan and save the baseline."
          verdict_terms: { pass: "BASELINE_WRITTEN", fail: "SCAN_FAILED" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/stringer-baseline-builder"
          fixtures:
            - { id: "scanable", dir: "voltron-evals/lib/fixtures/instances/stringer-baseline-builder/scanable", expected_verdict: "pass" }
            - { id: "broken",   dir: "voltron-evals/lib/fixtures/instances/stringer-baseline-builder/broken",   expected_verdict: "fail" }

      stringer-delta-reader:
        prompt_inputs:
          command_hint: "Read stringer baseline and report what changed since."
          verdict_terms: { pass: "DELTA_READ", fail: "BASELINE_MISSING" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/stringer-delta-reader"
          fixtures:
            - { id: "with-baseline", dir: "voltron-evals/lib/fixtures/instances/stringer-delta-reader/with-baseline", expected_verdict: "pass" }
            - { id: "missing",       dir: "voltron-evals/lib/fixtures/instances/stringer-delta-reader/missing",       expected_verdict: "fail" }

  # ── Publish-family ──────────────────────────────────────────────────────
  micro_committer:
    extends: "voltron-evals/shapes/micro_committer.yaml"
    agents:

      committer:
        canonical_action: "commit"
        prompt_inputs:
          commit_message_hint: "feat(util): add slugify utility"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/committer"
          fixture_remote_url: "/tmp/voltron-evals-fake-remote.git"

      pr-opener:
        canonical_action: "pr_opened"
        prompt_inputs:
          pr_title: "feat(util): add slugify utility"
          pr_body_hint: "Adds a pure slugify util + tests."
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/pr-opener"
          fixture_remote_url: "/tmp/voltron-evals-fake-remote.git"

      branch-manager:
        canonical_action: "branch_created"
        prompt_inputs:
          branch_name: "feat/slugify"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/branch-manager"

      deploy-trigger:
