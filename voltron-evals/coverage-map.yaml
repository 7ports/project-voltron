# voltron-evals/coverage-map.yaml
#
# Stage-5 deliverable: per-agent → shape coverage map (design §3.5).
# `tools/generate-instances.js` reads this file and emits one instance YAML
# per agent under `voltron-evals/instances/<shape>/<agent>.yaml`.
#
# The 70 non-judge templates in src/templates.js are distributed across the
# six Broad-layer shapes shipped in Stage 4:
#
#   tier1_coordinator      7   planning artifacts, no source edits
#   tier2_submanager       11  must dispatch ≥ floor micro-agents
#   micro_test_writer      1   produces a test file that exits 0
#   micro_validator        23  read-only verdict emitters (validators + inspects)
#   micro_committer        5   exactly one publish action, no side effects
#   micro_single_file_edit 23  exact-diff single-file edits
#   ─────────────────────  ─
#   TOTAL                  70  (+ 1 excluded: voltron-judge)
#
# Each agent entry supplies the `parameters` block the instance YAML will
# carry. Fixtures may not exist yet — Stage 6/7 fills those in. The shape
# loader interpolates `prompt_inputs` into the AUT prompt at dispatch time;
# the runner stays shape-agnostic.

shapes:

  # ── Tier-1 coordinators ─────────────────────────────────────────────────
  tier1_coordinator:
    extends: "voltron-evals/shapes/tier1_coordinator.yaml"
    agents:

      scrum-master:
        note: "Stub only — graded via Track B postmortem (design §8)."
        prompt_inputs:
          request_summary: "Given the 3-card backlog in BACKLOG.md, decompose into a sprint plan with owners and beads parent/children."
          expected_artifact_kind: "work_plan_table"
          artifact_anchors: ["| Task |", "| Owner |", "| Bead |"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/scrum-master", seed_files: ["BACKLOG.md"] }
        expected_files: ["WORKPLAN.md"]
        expected_beads_floor: 3

      code-analyst:
        prompt_inputs:
          request_summary: "Analyze the module at src/lib/ and produce a structural report."
          expected_artifact_kind: "research_summary"
          artifact_anchors: ["## Module:", "### Exports", "### Dependencies"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/code-analyst", seed_files: ["src/lib/index.ts"] }
        expected_files: ["docs/analysis/module-report.md"]

      doc-writer:
        prompt_inputs:
          request_summary: "Write a README section explaining the project's eval harness."
          expected_artifact_kind: "doc_section"
          artifact_anchors: ["## Eval Harness", "### Running"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/doc-writer", seed_files: ["README.md"] }
        expected_files: ["README.md"]

      researcher:
        prompt_inputs:
          request_summary: "Research current best practices for prompt caching with Anthropic's Claude API and produce a brief."
          expected_artifact_kind: "research_summary"
          artifact_anchors: ["## Sources", "## Findings"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/researcher", seed_files: [] }
        expected_files: ["docs/research/prompt-caching.md"]

      adr-writer:
        prompt_inputs:
          request_summary: "Write an ADR for the decision to ship eval harness in this repo rather than a separate package."
          expected_artifact_kind: "adr_file"
          artifact_anchors: ["# ADR", "## Status", "## Decision", "## Consequences"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/adr-writer", seed_files: ["docs/adr/0000-template.md"] }
        expected_files: ["docs/adr/0001-eval-harness-colocation.md"]

      api-doc-generator:
        prompt_inputs:
          request_summary: "Generate API reference for the routes registered in server/src/index.ts."
          expected_artifact_kind: "doc_section"
          artifact_anchors: ["## Endpoints", "### GET", "### POST"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/api-doc-generator", seed_files: ["server/src/index.ts"] }
        expected_files: ["docs/api.md"]

      diagram-maker:
        prompt_inputs:
          request_summary: "Produce a Mermaid sequence diagram of the eval harness dispatch flow."
          expected_artifact_kind: "doc_section"
          artifact_anchors: ["```mermaid", "sequenceDiagram"]
        fixture: { dir: "voltron-evals/lib/fixtures/instances/diagram-maker", seed_files: [] }
        expected_files: ["docs/diagrams/eval-dispatch.md"]

  # ── Tier-2 sub-managers ─────────────────────────────────────────────────
  tier2_submanager:
    extends: "voltron-evals/shapes/tier2_submanager.yaml"
    agents:

      project-planner:
        prompt_inputs:
          task_summary: "Design the data model + API contract for a new commenting feature on the eval results dashboard."
          acceptance_signals:
            - "docs/design/comments.md exists with schema + endpoints"
            - "at least one beads issue created for implementation"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/project-planner"
          expected_dispatch_targets: ["researcher", "adr-writer"]
        dispatch_floor: 2

      scene-architect:
        prompt_inputs:
          task_summary: "Compose a Unity scene that includes a player prefab + a UI canvas + an event manager — using your micro-agents."
          acceptance_signals:
            - "Assets/Scenes/Main.unity references the three components"
            - "no direct file edits by scene-architect itself"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/scene-architect"
          expected_dispatch_targets: ["csharp-script-writer", "asset-manager"]
        dispatch_floor: 2

      csharp-dev:
        prompt_inputs:
          task_summary: "Add a new MonoBehaviour `Health` (field + Damage method) plus a unit test, dispatching csharp-script-writer + csharp-member-adder + test-writer."
          acceptance_signals:
            - "Assets/Scripts/Health.cs exists with the Damage method"
            - "Assets/Tests/HealthTests.cs exists"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/csharp-dev"
          expected_dispatch_targets: ["csharp-script-writer", "csharp-member-adder", "test-writer"]
        dispatch_floor: 2

      shader-artist:
        prompt_inputs:
          task_summary: "Add a new URP shader graph + a material that uses it; document the new render pipeline asset's reference."
          acceptance_signals:
            - "Assets/Shaders/NewEffect.shadergraph exists"
            - "Assets/Materials/NewEffect.mat references the shader"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/shader-artist"
          expected_dispatch_targets: ["asset-manager", "csharp-script-writer"]
        dispatch_floor: 2

      build-validator:
        prompt_inputs:
          task_summary: "Run typecheck + lint + Play Mode smoke and produce a single combined verdict, dispatching the appropriate validators."
          acceptance_signals:
            - "final [STEP] block contains PASS/FAIL per validator"
            - "no source edits"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/build-validator"
          expected_dispatch_targets: ["typecheck-runner", "lint-runner", "test-runner"]
        dispatch_floor: 2

      asset-manager:
        prompt_inputs:
          task_summary: "Reorganize Assets/ folder structure per the project's naming convention and update affected manifest references."
          acceptance_signals:
            - "Assets/ folder layout matches docs/conventions.md"
            - "no manual file edits — all moves via micro-agents"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/asset-manager"
          expected_dispatch_targets: ["unity-manifest-editor", "yaml-patcher"]
        dispatch_floor: 2

      fullstack-dev:
        prompt_inputs:
          task_summary: "Add a typed util `useDebounce` AND a vitest spec AND run typecheck."
          acceptance_signals:
            - "client/src/hooks/useDebounce.ts created"
            - "client/src/hooks/useDebounce.test.ts created"
            - "typecheck-runner reports PASS"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/fullstack-dev"
          expected_dispatch_targets: ["function-writer", "test-writer", "typecheck-runner"]
        dispatch_floor: 2

      devops-engineer:
        prompt_inputs:
          task_summary: "Add a new GitHub Actions workflow that runs the eval harness on PR, plus a docker-compose service for local replay."
          acceptance_signals:
            - ".github/workflows/eval-replay.yml created"
            - "docker-compose.yml updated with a `replay` service"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/devops-engineer"
          expected_dispatch_targets: ["ci-workflow-writer", "docker-compose-editor"]
        dispatch_floor: 2

      ui-designer:
        prompt_inputs:
          task_summary: "Add CSS variables for a new dark-mode palette AND apply them to the dashboard layout component."
          acceptance_signals:
            - "client/src/styles/tokens.css contains new --color-dark-* variables"
            - "Dashboard component CSS references the new tokens"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/ui-designer"
          expected_dispatch_targets: ["design-token-writer", "css-writer"]
        dispatch_floor: 2

      qa-tester:
        prompt_inputs:
          task_summary: "Set up an a11y audit + a Lighthouse run for the dashboard and produce a combined report."
          acceptance_signals:
            - "docs/qa/dashboard-audit.md contains both a11y + lighthouse sections"
            - "audits ran without source edits"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/qa-tester"
          expected_dispatch_targets: ["accessibility-auditor", "lighthouse-runner"]
        dispatch_floor: 2

      harness-engineer:
        prompt_inputs:
          task_summary: "Process pending reflections, apply two surgical template edits, bump the version, and commit — using your micro-agents."
          acceptance_signals:
            - "src/templates.js modified for the targeted templates"
            - "package.json version bumped"
            - "commit made via the committer micro-agent"
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/harness-engineer"
          expected_dispatch_targets: ["file-patch-runner", "readme-section-writer", "committer"]
        dispatch_floor: 3

  # ── Test writers ────────────────────────────────────────────────────────
  micro_test_writer:
    extends: "voltron-evals/shapes/micro_test_writer.yaml"
    agents:
      test-writer:
        prompt_inputs:
          implementation_path: "src/utils/slugify.ts"
          test_path: "src/utils/slugify.test.ts"
          behaviour_spec: "Strips non-alphanumerics, lowercases, hyphenates whitespace, collapses consecutive hyphens."
          framework_hint: "vitest"
        fixture: { dir: "voltron-evals/lib/fixtures/instances/test-writer", seed_files: ["src/utils/slugify.ts", "package.json"] }
        expected_files: ["src/utils/slugify.test.ts"]
        test_command: "npx vitest run --reporter=basic src/utils/slugify.test.ts"

  # ── Validators + inspectors ─────────────────────────────────────────────
  micro_validator:
    extends: "voltron-evals/shapes/micro_validator.yaml"
    agents:

      typecheck-runner:
        prompt_inputs:
          command_hint: "npx tsc --noEmit"
          verdict_terms: { pass: "PASS", fail: "FAIL" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/typecheck-runner"
          fixtures:
            - { id: "clean",  dir: "voltron-evals/lib/fixtures/instances/typecheck-runner/clean",  expected_verdict: "pass" }
