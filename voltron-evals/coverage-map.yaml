      test-lister:
        prompt_inputs:
          command_hint: "Enumerate every test file and its top-level `describe`/`it` block."
          verdict_terms: { pass: "TESTS_FOUND", fail: "NO_TESTS" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/test-lister"
          fixtures:
            - { id: "has-tests", dir: "voltron-evals/lib/fixtures/instances/test-lister/has-tests", expected_verdict: "pass" }
            - { id: "no-tests",  dir: "voltron-evals/lib/fixtures/instances/test-lister/no-tests",  expected_verdict: "fail" }

      lint-reader:
        prompt_inputs:
          command_hint: "Run the linter in check-only mode and report the issue set."
          verdict_terms: { pass: "CLEAN", fail: "ISSUES" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/lint-reader"
          fixtures:
            - { id: "clean",  dir: "voltron-evals/lib/fixtures/instances/lint-reader/clean",  expected_verdict: "pass" }
            - { id: "issues", dir: "voltron-evals/lib/fixtures/instances/lint-reader/issues", expected_verdict: "fail" }

      type-error-reader:
        prompt_inputs:
          command_hint: "npx tsc --noEmit and summarize errors."
          verdict_terms: { pass: "NO_TYPE_ERRORS", fail: "TYPE_ERRORS" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/type-error-reader"
          fixtures:
            - { id: "clean",  dir: "voltron-evals/lib/fixtures/instances/type-error-reader/clean",  expected_verdict: "pass" }
            - { id: "errors", dir: "voltron-evals/lib/fixtures/instances/type-error-reader/errors", expected_verdict: "fail" }

      git-state-reader:
        prompt_inputs:
          command_hint: "Read git log + status + diff and produce a concise state summary."
          verdict_terms: { pass: "REPO_READ", fail: "NOT_A_REPO" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/git-state-reader"
          fixtures:
            - { id: "repo",     dir: "voltron-evals/lib/fixtures/instances/git-state-reader/repo",     expected_verdict: "pass" }
            - { id: "non-repo", dir: "voltron-evals/lib/fixtures/instances/git-state-reader/non-repo", expected_verdict: "fail" }

      api-shape-probe:
        prompt_inputs:
          command_hint: "Fetch the live endpoint and report its response shape."
          verdict_terms: { pass: "SHAPE_DOCUMENTED", fail: "UNREACHABLE" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/api-shape-probe"
          fixtures:
            - { id: "reachable",   dir: "voltron-evals/lib/fixtures/instances/api-shape-probe/reachable",   expected_verdict: "pass" }
            - { id: "unreachable", dir: "voltron-evals/lib/fixtures/instances/api-shape-probe/unreachable", expected_verdict: "fail" }

