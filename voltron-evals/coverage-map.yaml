            - { id: "issues", dir: "voltron-evals/lib/fixtures/instances/lint-runner/issues", expected_verdict: "fail" }

      build-runner:
        prompt_inputs:
          command_hint: "npm run build"
          verdict_terms: { pass: "PASS", fail: "FAIL" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/build-runner"
          fixtures:
            - { id: "builds",   dir: "voltron-evals/lib/fixtures/instances/build-runner/builds",   expected_verdict: "pass" }
            - { id: "broken",   dir: "voltron-evals/lib/fixtures/instances/build-runner/broken",   expected_verdict: "fail" }

      schema-validator:
        prompt_inputs:
          command_hint: "Validate the JSON payload against the schema."
          verdict_terms: { pass: "VALID", fail: "INVALID" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/schema-validator"
          fixtures:
            - { id: "valid",   dir: "voltron-evals/lib/fixtures/instances/schema-validator/valid",   expected_verdict: "pass" }
            - { id: "invalid", dir: "voltron-evals/lib/fixtures/instances/schema-validator/invalid", expected_verdict: "fail" }

      url-route-matcher:
        prompt_inputs:
          command_hint: "Check that every frontend fetch URL has a matching backend route."
          verdict_terms: { pass: "ALL_MATCHED", fail: "MISMATCH" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/url-route-matcher"
          fixtures:
            - { id: "matched",  dir: "voltron-evals/lib/fixtures/instances/url-route-matcher/matched",  expected_verdict: "pass" }
            - { id: "mismatch", dir: "voltron-evals/lib/fixtures/instances/url-route-matcher/mismatch", expected_verdict: "fail" }

      accessibility-auditor:
        prompt_inputs:
          command_hint: "Run an a11y audit (axe-cli or pa11y) against the served page."
          verdict_terms: { pass: "A11Y_PASS", fail: "A11Y_FAIL" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/accessibility-auditor"
          fixtures:
            - { id: "compliant", dir: "voltron-evals/lib/fixtures/instances/accessibility-auditor/compliant", expected_verdict: "pass" }
            - { id: "violations", dir: "voltron-evals/lib/fixtures/instances/accessibility-auditor/violations", expected_verdict: "fail" }

      lighthouse-runner:
        prompt_inputs:
          command_hint: "Run a Lighthouse audit against the served page."
          verdict_terms: { pass: "LH_PASS", fail: "LH_FAIL" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/lighthouse-runner"
          fixtures:
            - { id: "fast", dir: "voltron-evals/lib/fixtures/instances/lighthouse-runner/fast", expected_verdict: "pass" }
            - { id: "slow", dir: "voltron-evals/lib/fixtures/instances/lighthouse-runner/slow", expected_verdict: "fail" }

      security-scanner:
        prompt_inputs:
          command_hint: "npm audit --audit-level=high"
          verdict_terms: { pass: "NO_HIGH_VULN", fail: "VULNERABLE" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/security-scanner"
          fixtures:
            - { id: "clean",  dir: "voltron-evals/lib/fixtures/instances/security-scanner/clean",  expected_verdict: "pass" }
            - { id: "vulnerable", dir: "voltron-evals/lib/fixtures/instances/security-scanner/vulnerable", expected_verdict: "fail" }

      coverage-runner:
        prompt_inputs:
          command_hint: "npx vitest run --coverage"
          verdict_terms: { pass: "MEETS_THRESHOLD", fail: "BELOW_THRESHOLD" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/coverage-runner"
          fixtures:
            - { id: "covered",   dir: "voltron-evals/lib/fixtures/instances/coverage-runner/covered",   expected_verdict: "pass" }
            - { id: "uncovered", dir: "voltron-evals/lib/fixtures/instances/coverage-runner/uncovered", expected_verdict: "fail" }

      dep-reader:
        prompt_inputs:
          command_hint: "Read package.json / requirements.txt and report the dependency set."
          verdict_terms: { pass: "FOUND", fail: "NOT_FOUND" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/dep-reader"
          fixtures:
            - { id: "has-deps",    dir: "voltron-evals/lib/fixtures/instances/dep-reader/has-deps",    expected_verdict: "pass" }
            - { id: "no-manifest", dir: "voltron-evals/lib/fixtures/instances/dep-reader/no-manifest", expected_verdict: "fail" }

      route-lister:
        prompt_inputs:
          command_hint: "List every registered HTTP route in the codebase."
          verdict_terms: { pass: "ROUTES_LISTED", fail: "NO_ROUTES" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/route-lister"
          fixtures:
            - { id: "has-routes", dir: "voltron-evals/lib/fixtures/instances/route-lister/has-routes", expected_verdict: "pass" }
            - { id: "no-routes",  dir: "voltron-evals/lib/fixtures/instances/route-lister/no-routes",  expected_verdict: "fail" }

      schema-inspector:
        prompt_inputs:
          command_hint: "Inspect Prisma schema / SQL migrations and report the schema model."
          verdict_terms: { pass: "SCHEMA_READ", fail: "SCHEMA_MISSING" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/schema-inspector"
          fixtures:
            - { id: "present", dir: "voltron-evals/lib/fixtures/instances/schema-inspector/present", expected_verdict: "pass" }
            - { id: "missing", dir: "voltron-evals/lib/fixtures/instances/schema-inspector/missing", expected_verdict: "fail" }

      log-tailer:
        prompt_inputs:
          command_hint: "Tail recent log output and report the last N lines + any error counts."
          verdict_terms: { pass: "LOGS_READ", fail: "NO_LOGS" }
        fixture:
          dir: "voltron-evals/lib/fixtures/instances/log-tailer"
          fixtures:
            - { id: "with-logs", dir: "voltron-evals/lib/fixtures/instances/log-tailer/with-logs", expected_verdict: "pass" }
