# voltron-evals/shapes/micro_committer.yaml
#
# Broad-layer SHAPE. Covers commit-only / git-flow micro-agents whose entire
# job is one publish action with zero side effects: committer, branch-creator,
# pr-opener, branch-manager, deploy-trigger, changelog-updater.
# TODO(stage-5): wire instance generator.

id: "micro_committer"
kind: "broad"
description: |
  Given a clean staged change, did the publish-family agent perform its one
  exact action (commit / branch / PR / deploy / changelog append) with no
  source-file edits, no extra tool calls beyond the canonical sequence, and
  a final [DONE] line?
rubric: "voltron-evals/rubrics/shapes/micro_committer.md"
rubric_version_expected: "1.0.0"

parameters:
  agent_under_test:
    type: "string"
    required: true
    description: "Publish-family template name (committer | branch-creator | pr-opener | …)."
  prompt_inputs:
    type: "object"
    required: true
    description: |
      Required keys vary by canonical action:
        committer        → `commit_message_hint` (short subject the agent must use verbatim or paraphrase)
        branch-creator   → `branch_name`
        pr-opener        → `pr_title`, `pr_body_hint`
        deploy-trigger   → `target_env` (e.g. "staging")
        changelog-updater→ `entry_summary`, `section` (e.g. "Added")
      The runner picks the prompt template by `canonical_action`.
  fixture:
    type: "object"
    required: true
    description: |
      Required keys: `dir` (a git workspace with EXACTLY the change pre-staged
      that the AUT is meant to publish — for `committer` and `pr-opener` this
      means files in the index already; for `branch-creator` this means a
      clean tree on a known base branch; for `changelog-updater` this means
      a CHANGELOG.md template at a known anchor). The fixture also pins a
      synthetic git remote (`fixture_remote_url`) so push-style actions never
      escape into a real remote.
  canonical_action:
    type: "string"
    required: true
    description: |
      One of: `commit | branch_created | pr_opened | deployed | changelog_appended`.
      The `publish_action_taken` scorer verifies the git/state delta matches
      exactly this action and nothing else.
  forbidden_files:
    type: "array<string>"
    required: false
    default: "any path outside the canonical action's surface"
    description: |
      committer        → may modify nothing (commit only)
      branch-creator   → may modify nothing (ref creation only)
      changelog-updater→ may modify ONLY CHANGELOG.md (or the path in `fixture.changelog_path`)
      pr-opener        → may modify nothing locally (GitHub API call only)
      deploy-trigger   → may modify nothing locally
  max_turns:
    type: "integer"
    required: false
    default: 6

programmatic_signals:
  capture_turn_count: true
  capture_files_changed: true
  detect_micro_agent_dispatch: false
  capture_beads_snapshot: false
  require_done_line: true
  check_doc_updates: false
  capture_alexandria_calls: false
  # Shape-specific: enumerates the action actually taken (commit, branch,
  # PR, deploy, changelog-append, none, multiple) so the rubric can compare
  # against `canonical_action`.
  capture_publish_action: true          # TODO(stage-5): wire in scorers lib

applies_to:
  category: "publish"
  tier: 3
  must_not_dispatch: true

notes: |
  Scoring is programmatic-only. Caught failure modes: agent commits AND
  pushes (push not requested), agent edits source while committing, branch-
  creator switches to a different branch than requested, pr-opener also
  commits, changelog-updater rewrites surrounding entries. The shape exists
  to keep publish-family agents narrow — these agents are dangerous when
  they take initiative.
