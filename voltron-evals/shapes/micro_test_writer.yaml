# voltron-evals/shapes/micro_test_writer.yaml
#
# Broad-layer SHAPE. Covers test-writing micro-agents: test-writer,
# vitest-writer, unit-test-writer (and any future framework-specific
# test scaffolders). Instances live in voltron-evals/instances/.
# TODO(stage-5): wire instance generator + shape-to-instance expansion.
#
# Distinguished from micro_single_file_edit because the success signal is
# "the test file exists AND the test runner exits 0 against the supplied
# implementation", not just an exact-diff match — test-writers have more
# legitimate freedom in how they shape an assertion than a route-adder
# has in how it registers a route.

id: "micro_test_writer"
kind: "broad"
description: |
  Given a target implementation file + a behaviour spec, did the test-writer
  produce a runnable test file at the expected path that exits 0 when executed
  against the implementation, with no edits to the implementation itself?
rubric: "voltron-evals/rubrics/shapes/micro_test_writer.md"
rubric_version_expected: "1.0.0"

parameters:
  agent_under_test:
    type: "string"
    required: true
    description: "Test-writer template name (test-writer | vitest-writer | unit-test-writer)."
  prompt_inputs:
    type: "object"
    required: true
    description: |
      Required keys: `implementation_path` (the file the tests must exercise),
      `test_path` (where the new test file MUST land), `behaviour_spec`
      (1–3 sentence description of the cases to cover, e.g. "typical debounce
      delays callbacks; immediate-leading invocation runs once"). Optional:
      `framework_hint` (e.g. "vitest" | "jest" | "pytest") if the agent name
      doesn't pin one.
  fixture:
    type: "object"
    required: true
    description: |
      Required keys: `dir` (workspace seed with the implementation file
      already present, package.json / pyproject.toml configured for the test
      framework), `seed_files` (paths copied into scratch). The fixture's
      package manifest MUST provide a working `npm test` / `pytest` entry
      point so the verdict scorer can execute it without further setup.
  expected_files:
    type: "array<string>"
    required: true
    description: |
      Exact set of test file paths the run MUST create. Almost always a
      single-element array (the `test_path`).
  forbidden_files:
    type: "array<string>"
    required: false
    default: "any path NOT in expected_files"
    description: |
      The implementation file specifically must NOT be edited — the test
      writer is allowed to ADD tests, not refactor production code. The
      `source_diff_empty` scorer asserts this against `implementation_path`.
  test_command:
    type: "string"
    required: true
    description: |
      Shell command the runner executes in the scratch workspace after the
      agent finishes. Verdict MET iff exit code is 0. Example:
      `npx vitest run --reporter=basic <test_path>` or `pytest -x <test_path>`.
  max_turns:
    type: "integer"
    required: false
    default: 12

programmatic_signals:
  capture_turn_count: true
  capture_files_changed: true
  detect_micro_agent_dispatch: false
  capture_beads_snapshot: false
  require_done_line: true
  check_doc_updates: false
  capture_alexandria_calls: false
  # Shape-specific: runner shells `test_command` post-run, captures exit code.
  capture_test_command_exit: true       # TODO(stage-5): wire in scorers lib

applies_to:
  category: "micro-agent-write"
  subcategory: "test-writer"
  tier: 3
  must_not_dispatch: true

notes: |
  Scoring is programmatic-only. Distinct from micro_single_file_edit because
  this shape evaluates the EXECUTION OUTCOME of the produced file, not just
  its presence/shape. Caught failure modes: empty/skeleton tests, tests that
  silently always pass, edits to production code, tests at the wrong path.
