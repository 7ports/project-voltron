<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Voltron Engine">
  <title>Voltron Engine</title>
  <!--
    Simplified V/A mark for 16-32px. An upright chevron + crossbar (behind, amber, dimmed)
    reads as an A; a vertically-flipped copy of the same chevron (front, currentColor)
    reads as the prominent V. Front stays single-color-safe via currentColor.
  -->
  <defs>
    <linearGradient id="favDuotone" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="27" y2="28">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- BACK LAYER: upright chevron + crossbar, the A behind. Amber + dimmed so it recedes. -->
  <g opacity="0.45"
     fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 26 L16 6 L26 26"/>
    <path d="M10 19 L22 19"/>
  </g>

  <!-- FRONT LAYER: vertically-flipped chevron, the prominent V in front. -->
  <g transform="translate(0,32) scale(1,-1)" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 26 L16 6 L26 26"/>
    <path d="M10 19 L22 19"/>
  </g>
  <circle cx="16" cy="6" r="3" fill="currentColor" transform="translate(0,32) scale(1,-1)"/>
</svg>
